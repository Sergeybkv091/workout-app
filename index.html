<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренировки Татьяны</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <meta name="theme-color" content="#166b63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .exercise-card { transition: all 0.3s; }
    .exercise-card.completed { background-color: #d1fae5; }
    .exercise-card.incomplete { background-color: #f3f4f6; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-xl">

    <!-- HEADER -->
    <header class="bg-emerald-600 text-white p-4 flex items-center justify-between sticky top-0 z-50">
      <div>
        <h1 class="text-2xl font-bold">Тренировки</h1>
        <p id="current-date" class="text-emerald-100 text-sm"></p>
      </div>
      <button onclick="showSettings()" class="bg-white/20 px-4 py-2 rounded-full text-sm font-medium">⚙️</button>
    </header>

    <main id="main-content" class="p-4 pb-24">

      <!-- HOME SCREEN -->
      <div id="home-screen">
        <div class="mb-6">
          <p class="text-gray-500 text-sm">Сегодня</p>
          <p id="today-exercise" class="text-2xl font-bold text-emerald-600 mb-4">Понедельник — Ноги и ягодицы</p>
          <button onclick="startWorkout()" 
                  class="w-full bg-emerald-600 text-white px-6 py-3 rounded-2xl font-semibold shadow-lg">
            Начать тренировку
          </button>
        </div>

        <div class="grid grid-cols-3 gap-3 text-center">
          <div onclick="showProgress()" class="bg-white p-4 rounded-3xl shadow">
            <p class="text-xs text-gray-500">Прогресс</p>
            <p class="text-3xl font-bold text-emerald-600" id="home-progress">0%</p>
          </div>
          <div onclick="showCalendar()" class="bg-white p-4 rounded-3xl shadow">
            <p class="text-xs text-gray-500">Неделя программы</p>
            <p class="text-3xl font-bold text-emerald-600" id="home-week">1</p>
          </div>
          <div class="bg-white p-4 rounded-3xl shadow">
            <p class="text-xs text-gray-500">Следующая</p>
            <p class="text-3xl font-bold text-emerald-600" id="next-day">Среда</p>
          </div>
        </div>
      </div>

      <!-- WORKOUT SCREEN -->
      <div id="workout-screen" class="hidden">
        <div class="flex justify-between items-center mb-4">
          <button onclick="cancelWorkout()" class="text-gray-500 font-medium">← Назад</button>
          <span id="workout-day" class="font-semibold text-lg"></span>
        </div>

        <div id="exercises-list" class="space-y-3"></div>

        <button onclick="endWorkout()" 
                class="w-full mt-6 bg-emerald-600 text-white px-6 py-3 rounded-2xl font-semibold shadow-lg">
          Завершить тренировку
        </button>
      </div>

      <!-- CALENDAR SCREEN -->
      <div id="calendar-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4">Календарь на 8 недель</h2>
        <div id="calendar-grid" class="space-y-4"></div>
      </div>

      <!-- PROGRESS SCREEN -->
      <div id="progress-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4">Мой прогресс</h2>
        <div id="progress-chart" class="bg-white p-6 rounded-3xl shadow mb-6"></div>
        <div id="progress-list" class="space-y-4"></div>
      </div>

      <!-- SETTINGS SCREEN -->
      <div id="settings-screen" class="hidden">
        <h2 class="text-xl font-bold mb-4">Настройки</h2>
        <div class="bg-white p-4 rounded-3xl shadow mb-4">
          <div class="flex justify-between items-center mb-4">
            <span>Напоминания</span>
            <button onclick="toggleReminders()" id="reminder-toggle" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-sm">Включены</button>
          </div>
          <div class="flex justify-between items-center mb-4">
            <span>Неделя программы</span>
            <input type="number" id="program-week" min="1" max="8" value="1" class="w-16 text-center border rounded-xl p-2">
          </div>
          <button onclick="saveSettings()" class="w-full bg-emerald-600 text-white px-4 py-2 rounded-xl">Сохранить</button>
        </div>
        <button onclick="resetData()" class="w-full bg-red-500 text-white px-4 py-2 rounded-xl">Сбросить все данные</button>
      </div>

    </main>

    <!-- BOTTOM NAV -->
    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 max-w-md w-full bg-white border-t border-gray-200 shadow-2xl">
      <div class="flex justify-around py-3">
        <button onclick="showHome()" id="nav-home" class="flex flex-col items-center text-emerald-600">
          <span class="text-2xl">🏠</span>
          <span class="text-xs mt-1">Главная</span>
        </button>
        <button onclick="showCalendar()" id="nav-calendar" class="flex flex-col items-center text-gray-400">
          <span class="text-2xl">📅</span>
          <span class="text-xs mt-1">Календарь</span>
        </button>
        <button onclick="showProgress()" id="nav-progress" class="flex flex-col items-center text-gray-400">
          <span class="text-2xl">📈</span>
          <span class="text-xs mt-1">Прогресс</span>
        </button>
      </div>
    </nav>

  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
